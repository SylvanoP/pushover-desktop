[package]
name = "openover-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pushover Open Client API — login, devices, messages, WebSocket (unofficial)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
