[package]
name = "openover-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tray-first unofficial Pushover Open Client desktop app (GPUI)"

[[bin]]
name = "openover-desktop"
path = "src/main.rs"

[dependencies]
openover-core = { path = "../openover-core" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-channel = "0.3"
futures-util = "0.3"
gpui_ce_backend = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-ce", "menu-state"] }
gpui_ce_elements = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "UI_Notifications", "Data_Xml_Dom", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
