[workspace]
resolver = "3"
members = ["crates/openover-core", "crates/openover-desktop"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/SylvanoP/pushover-desktop"

# A debug build shapes text and composites through unoptimized GPUI, which the
# window shows as dropped frames while scrolling. The crate itself stays
# debuggable; everything below it is built optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tracing = "0.1"
