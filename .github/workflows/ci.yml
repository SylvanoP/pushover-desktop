name: CI

on:
  push:
    branches: [main, master, "cursor/**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libfontconfig-dev \
            libfreetype6-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all

  build:
    name: build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p openover-desktop
      - name: Upload Windows executable
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: openover-desktop-windows-x64
          path: target/release/openover-desktop.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [check, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openover-desktop-windows-x64
          path: dist
      - name: Publish openover-desktop-windows-x64.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Move-Item -Force dist/openover-desktop.exe dist/openover-desktop-windows-x64.exe
          gh release create "${{ github.ref_name }}" "dist/openover-desktop-windows-x64.exe" --title "${{ github.ref_name }}" --notes "Windows x64 build of the tray app."
